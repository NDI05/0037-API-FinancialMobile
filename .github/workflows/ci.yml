name: backend
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: go build -o /tmp/pam-api ./cmd/api
